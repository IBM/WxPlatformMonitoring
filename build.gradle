// copy the packages from the is_packages folder to the tmp folder
task copyPackages() {
	doLast {
		println "> Copying package from is_packages to tmp"
		copy {
			from "is_packages"
			into "tmp"
		}
	}
}

// dynamically create a task for each pacakge to manipulate the manifest.v3 file
def manifesto(packageName) {
	return tasks.create("manifest${packageName}") {
		doLast {
			def mv3 = new File(projectDir, "tmp/${packageName}/manifest.v3")
			def xml = new XmlSlurper().parse(mv3)
			def nodes = xml.'**'.findAll { node ->
				if( node.@'name' == "build" ) {
					node.replaceBody "${buildNumber} (${version})"
				}
				if( node.@'name' == "version" ) {
					node.replaceBody version
				}
			}
			mv3.withWriter { out ->
				groovy.xml.XmlUtil.serialize(xml, out)
			}
			println "> Created manifest.v3 for package ${packageName} with version $version"
		}
	}
}

// task rule for dynamically creating a task for each zip to create
tasks.addRule('Pattern: zipPackage<PACKAGE>') { String taskName ->
	if (taskName.startsWith('zipPackage')) {
		// get the package name from the task name
		def packageName = (taskName - 'zipPackage')
		task(taskName, dependsOn: manifesto(packageName), type: Zip) {
			println "> Creating zip for package ${packageName}..."
			archiveName "${packageName}.zip"
			from "tmp/${packageName}"
			destinationDir file("src/wxplatformmon/dist")
		}
	}
}
// zip all packages
task zipPackages {
	dependsOn << packages.collect { packageName -> "zipPackage${packageName}" }
}

// wxplatformmonDistZip is automatically created by the Distribution plugin for the configuration wxplatformmon
wxplatformmonDistZip.dependsOn zipPackages

task createReleaseNotes(dependsOn: classes) {
	doLast {
		javaexec {
			println "> Creating release notes"
			main = 'com.softwareag.wx.restServices.utils.labcase.ReleaseNotes'
			classpath = sourceSets.main.runtimeClasspath
			args('-versionId', labcaseReleaseVersion)
			args('-filePath', './tmp/releaseNotes.txt')
		}
	}
}

// copy the release notes to the packages and in the dist folder
task copyReleaseNote(dependsOn: createReleaseNotes) {
	doLast {
		['tmp/WxPlatformMonitoring/resources', 'tmp/WxPlatformMonitoring_Test/resources', 'src/wxplatformmon/dist'].each { dest ->
			println "> Copy releaseNotes into $dest with version $version"
			copy {
				from ("tmp/releaseNotes.txt")  {
					filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: ["version": project.version.toString()])
				}
				into(dest)
				rename { String fileName -> "releaseNotes_${project.version.toString()}.txt" }
			}
		}
	}
}

// remove old data
task cleanup {
	doLast {
		delete "tmp"
		delete "src/dist/wxplatformmon"
	}
}


packages.each { packageName ->
	tasks.create(name: "createSymLinkFor${packageName}", type: Exec) {
		commandLine 'cmd', '/c', 'MKLINK'
		def link = props['is.home'] + "/packages/" + packageName
		def resource = file("./is_packages/$packageName").getAbsolutePath()
		args '/D', '"' + link + '"', '"' + resource + '"'
		ignoreExitValue true
		doLast { println "> Created symlink for package $packageName" }
	}
}


task jcodeMakeAll(type: Exec, dependsOn: "distributeLocal") {
	workingDir "${props['is.home']}/bin"
	commandLine 'cmd', '/c', "${props['is.home']}/bin/jcode.bat"
	args 'makeall', 'WxPlatformMonitoring'
	ignoreExitValue true
	doLast {
		ant.get(src: "http://" + props['is.host'] + ":" + props['is.port'] + "/WmRoot/package-list.dsp?action=reload&package=WxPlatformMonitoring", dest: "", username: "Administrator", password: "manage", verbose: "true")
		ant.delete(file: "package-list.dsp")
		println "> Executed jcode for WxPlatformMonitoring"
	}
}


/**
 * install packages as symbolic links into IntegrationServer's packages dir
 */
task distributeLocal {
	dependsOn classes
	dependsOn << packages.collect { "createSymLinkFor$it" }
	doLast {
		// copy relevant jars to the jar dir
		copy {
			// create the jar with the test builder
			// get the jar references by the testbuilder configuration
			from project.configurations.wxplatformmonjars
			into ('is_packages/WxPlatformMonitoring/code/jars/')
		}
		ant.get(src: "http://" + props['is.host'] + ":" + props['is.port'] + "/invoke/wm.server.packages.adminui/packageActivate?action=activate&package=WxPlatformMonitoring", dest: "", username: "Administrator", password: "manage", verbose: "true")
		ant.get(src: "http://" + props['is.host'] + ":" + props['is.port'] + "/invoke/wm.server.packages.adminui/packageActivate?action=activate&package=WxPlatformMonitoring_Test", dest: "", username: "Administrator", password: "manage", verbose: "true")
		ant.delete(file: "packageActivate")
	}
}



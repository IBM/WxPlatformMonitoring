task uploadRelease(type: Upload) {
	configuration = configurations.wxplatformmon
	repositories {
		mavenDeployer {
			configuration = configurations.wxplatformmon
			def DAV =  [
				server: "labcase.softwareag.com",
				root: "dav",
				user: "waa",
				pass: getLabcasePassword()
			]
			def labcasePath = "DE/GCS/GCS/wxplatformmon/"
			if(getProjectVersion().endsWith('SNAPSHOT')) {
				labcasePath = labcasePath + "snapshots"
			} else if(!getProjectVersion().endsWith('RELEASE')) {
				labcasePath = labcasePath + "release"
			} else {
				throw new RuntimeException("Could not determine version for " + getProjectVersion());
			}
			repository(url: "dav:https://${DAV.server}/${DAV.root}/${labcasePath}") {
				println "> uploading to release repo"
				authentication(userName: DAV.user, password: DAV.pass)
			}
			uniqueVersion = false
			pom.project {
				licenses {
					license {
						name 'Software AG GCS - wM Consulting Tools - WxPlatformMonitoring'
						url 'https://labcase.softwareag.com/projects/primetoolsutilities/wiki/Home'
						distribution 'manual'
					}
				}
				organization {
					name 'Software AG GCS'
					url 'https://labcase.softwareag.com/projects/primetoolsutilities'
				}
				developers {
					developer {
						id 'waa'
						name 'Henning Waack'
						organization = 'Software AG GCS'
						roles {
							role 'Project Manager'
							role 'Architect'
							role 'Developer'
						}
					}
				}
			}
			// remove alll dependencies, should be set in sub projects (does not work though)
			pom.scopeMappings.with {
				mappings.clear()
				addMapping(300, configurations.wxplatformmonjars, 'wxplatformmonjars')
			}
		}
	}
}


task releaseActions(dependsOn: [cleanup, copyPackages, copyReleaseNote, wxplatformmonDistZip, install, uploadRelease]) {
